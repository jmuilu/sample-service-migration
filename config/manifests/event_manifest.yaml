import:
  targetTable: "sample.event"
  operation: "INSERT"
  errorHandling:
    onMissingFK: "SKIP"
  batchSize: 100
  naturalKeys:
    - "sample_id"
    - "event_type"
    - "event_time"
  columnMappings:
    - csv: "ID"
      column: "id"
      type: "BIGINT"
    - csv: "SAMPLEID"
      column: "sample_id"
      type: "BIGINT"
      foreignKey:
        parentTable: "sample.sample"
        parentNaturalKey:
          - csv: "SAMPLEID"
            column: "sampleid"
    - csv: "EVENT_TYPE"
      column: "event_type"
      type: "VARCHAR"
      transformScript: "config/scripts/event_transform.js"
      transformFunction: "transformEventType"
    - csv: "EVENT_TIME"
      column: "event_time"
      type: "TIMESTAMP"
    - csv: "EVENT_REASON"
      column: "event_reason"
      type: "VARCHAR"
      transformScript: "config/scripts/event_transform.js"
      transformFunction: "transformEventReason"
    # task_id is not mapped: a legacy sample event belongs to no order, so it stays NULL (sample-service ADR 0051
    # decision 1; the SYSTEM-DEFAULT task is gone). Why it was written is its MIGRATION transaction-log row.
    - csv: "TEMPERATURE"
      column: "temperature"
      type: "REAL"
    - csv: "COMMENT"
      column: "remarks"
      type: "VARCHAR"
    - csv: "USERNAME"
      column: "userstamp"
      type: "VARCHAR"
