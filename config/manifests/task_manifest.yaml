import:
  targetTable: "sample.task"
  operation: "UPSERT"
  batchSize: 100
  naturalKeys:
    - "name"
  columnMappings:
    - csv: "NAME"
      column: "name"
      type: "VARCHAR"
    - csv: "COMMENT"
      column: "description"
      type: "VARCHAR"
    - csv: "ISPICK"
      column: "task_type"
      type: "VARCHAR"
      transformScript: "config/scripts/task_transform.js"
      transformFunction: "transformTaskType"
    - csv: "BATCH_STATUS"
      column: "task_status"
      type: "VARCHAR"
      transformScript: "config/scripts/task_transform.js"
      transformFunction: "transformTaskStatus"
    - csv: "USERNAME"
      column: "assigned_to"
      type: "VARCHAR"
    - csv: "PROJECT_ID"
      column: "project_id"
      type: "BIGINT"
    - csv: "PARTNER_ID"
      column: "partner_id"
      type: "BIGINT"
    - csv: "USERNAME"
      column: "userstamp"
      type: "VARCHAR"
    - csv: "TIMELOG"
      column: "created"
      type: "TIMESTAMP"
      transformScript: "config/scripts/work_list_transform.js"
      transformFunction: "transformCreated"
