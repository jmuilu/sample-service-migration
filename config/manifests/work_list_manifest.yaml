import:
  targetTable: "sample.work_list"
  operation: "UPSERT"
  batchSize: 100
  naturalKeys:
    - "name"
  columnMappings:
    - csv: "NAME"
      column: "name"
      type: "VARCHAR"
    - csv: "ISPICK"
      column: "list_type"
      type: "VARCHAR"
      transformScript: "config/scripts/work_list_transform.js"
      transformFunction: "transformListType"
    - csv: "BATCH_STATUS"
      column: "list_status"
      type: "VARCHAR"
      transformScript: "config/scripts/work_list_transform.js"
      transformFunction: "transformListStatus"
    - csv: "USERNAME"
      column: "assigned_to"
      type: "VARCHAR"
    - csv: "COMMENT"
      column: "remarks"
      type: "VARCHAR"
    # Core's ids, no foreign key; blank stays NULL (the biobank itself). priority is not mapped: DB2
    # BATCH_LIST has no priority, so the column default (3, normal) applies.
    - csv: "PROJECT_ID"
      column: "project_id"
      type: "BIGINT"
    - csv: "PARTNER_ID"
      column: "partner_id"
      type: "BIGINT"
    - csv: "USERNAME"
      column: "userstamp"
      type: "VARCHAR"
    - csv: "BEGIN_TIME"
      column: "created"
      type: "TIMESTAMP"
      transformScript: "config/scripts/work_list_transform.js"
      transformFunction: "transformCreated"
    - csv: "PARENT_NAME"
      column: "parent_id"
      type: "BIGINT"
      foreignKey:
        parentTable: "sample.work_list"
        parentNaturalKey:
          - csv: "PARENT_NAME"
            column: "name"

