import:
  targetTable: "sample.sample_type_quality_metadata"
  operation: "UPSERT"
  errorHandling:
    onMissingFK: "SKIP"
  naturalKeys:
    - "sample_type"
    - "quality"
  columnMappings:
    - csv: "SAMPLETYPE"
      column: "sample_type"
      type: "VARCHAR"
      transformScript: "config/scripts/sample_type_transform.js"
      transformFunction: "transformSampleTypeTerm"
    - csv: "QUALITY"
      column: "quality"
      type: "VARCHAR"
    - csv: "USERNAME"
      column: "userstamp"
      type: "VARCHAR"
    - csv: "VERSION"
      column: "version"
      type: "INTEGER"
